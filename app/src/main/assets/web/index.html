<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <title>FileDroid</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- PIN Screen -->
    <div id="pinScreen" class="pin-screen" style="display:none">
        <div class="pin-container">
            <div class="pin-icon">🔒</div>
            <h2>PIN Required</h2>
            <p>Enter the PIN to access files</p>
            <input type="password" id="pinInput" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="Enter PIN">
            <button id="pinSubmit" class="btn btn-primary">Unlock</button>
            <p id="pinError" class="error-text" style="display:none"></p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="logo">📂 FileDroid</span>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search files..." autocomplete="off">
                    <button id="searchBtn" class="icon-btn" title="Search">🔍</button>
                    <button id="clearSearch" class="icon-btn" style="display:none" title="Clear">✕</button>
                </div>
                <button id="toggleView" class="icon-btn" title="Toggle view">
                    <span id="viewIcon">▦</span>
                </button>
                <button id="uploadBtn" class="icon-btn upload-btn" title="Upload files">⬆️</button>
            </div>
        </header>

        <!-- Breadcrumbs -->
        <nav id="breadcrumbs" class="breadcrumbs"></nav>

        <!-- Toolbar -->
        <div id="toolbar" class="toolbar" style="display:none">
            <div class="toolbar-left">
                <label class="select-all-label">
                    <input type="checkbox" id="selectAll">
                    <span id="selectedCount">0 selected</span>
                </label>
            </div>
            <div class="toolbar-right">
                <button id="downloadSelected" class="btn btn-sm">⬇️ Download</button>
            </div>
        </div>

        <!-- Sort Bar -->
        <div class="sort-bar">
            <span class="sort-label">Sort by:</span>
            <button class="sort-btn active" data-sort="name">Name</button>
            <button class="sort-btn" data-sort="date">Date</button>
            <button class="sort-btn" data-sort="size">Size</button>
            <button class="sort-btn" data-sort="type">Type</button>
        </div>

        <!-- File List -->
        <main id="fileContainer" class="file-container list-view"></main>

        <!-- Loading -->
        <div id="loading" class="loading" style="display:none">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display:none">
            <div class="empty-icon">📁</div>
            <p>This folder is empty</p>
        </div>

        <!-- Upload Area -->
        <div id="uploadArea" class="upload-area" style="display:none">
            <div class="upload-modal">
                <div class="upload-header">
                    <h3>Upload Files</h3>
                    <button id="closeUpload" class="icon-btn">✕</button>
                </div>
                <div class="upload-dropzone" id="dropzone">
                    <div class="dropzone-content">
                        <span class="dropzone-icon">📤</span>
                        <p>Click or tap to select files</p>
                        <input type="file" id="fileInput" multiple style="display:none">
                    </div>
                </div>
                <div id="uploadProgress" class="upload-progress"></div>
            </div>
        </div>

        <!-- Preview Modal -->
        <div id="previewModal" class="preview-modal" style="display:none">
            <div class="preview-header">
                <span id="previewTitle" class="preview-title"></span>
                <div class="preview-actions">
                    <a id="previewDownload" class="icon-btn" title="Download">⬇️</a>
                    <button id="closePreview" class="icon-btn">✕</button>
                </div>
            </div>
            <div id="previewContent" class="preview-content"></div>
        </div>

        <!-- Server Info -->
        <footer class="footer">
            <span id="serverInfo"></span>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/filemanager.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
